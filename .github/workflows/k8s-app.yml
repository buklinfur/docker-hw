name: Docker Build, Test and Push

on:
  push:
    branches: ["k8s-app", "main"]
  pull_request:
    branches: ["k8s-app"]

env:
  BUILD_TYPE: Debug
  APP_DIR: candle-app

permissions:
  contents: write

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            compiler: gcc
            version: "13"
          - os: windows-latest
            compiler: gcc
            version: "11.2.0"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-${{ matrix.version }} cmake

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install mingw --version=${{ matrix.version }} -y
          choco install cmake -y

      - name: Configure CMake
        working-directory: ${{ env.APP_DIR }}
        run: cmake -B build

      - name: Build
        working-directory: ${{ env.APP_DIR }}
        run: cmake --build build

      - name: Run tests with CTest
        working-directory: ${{ env.APP_DIR }}/build
        run: ctest -C ${{ env.BUILD_TYPE }} --output-on-failure

  docker-build-push:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push candle-app
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/candle-app:latest -f ./candle-app/Dockerfile.app ./candle-app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/candle-app:latest

      - name: Build and Push candle-web
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/candle-web:latest -f ./web/Dockerfile.web ./web
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/candle-web:latest

  helm-deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: v3.13.3

      - name: Package Helm chart
        run: |
          helm package helm/test-repo-chart

      - name: Create and push Git tag for Helm release
        run: |
          TAG="v$(date +'%Y%m%d%H%M%S')"
          echo "TAG=$TAG" >> $GITHUB_ENV
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "$TAG"
          git push https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }} "$TAG"

      - name: Publish Helm chart as GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: test-repo-chart-*.tgz
          tag_name: ${{ env.TAG }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      - name: Configure Kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 --decode > $HOME/.kube/config

      - name: Deploy chart with Helm
        run: |
          helm upgrade --install candle-release ./helm/test-repo-chart --namespace default --wait
